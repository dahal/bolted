version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies for all projects
    deps: [docs:install]

  build:
    desc: Build all projects (CLI + docs)
    deps: [cli:build, docs:build]

  test:
    desc: Run all unit tests
    deps: [cli:test]

  lint:
    desc: Lint all projects
    deps: [cli:lint, docs:lint]

  check:
    desc: Run type checks / static analysis across all projects
    deps: [cli:check, docs:check]

  cli:build:
    desc: Build the Bolted CLI binary into ./dist (also creates a `bolt` symlink)
    cmds:
      - mkdir -p dist
      - >-
        go build
        -ldflags "-X github.com/dahal/bolted/internal/buildinfo.Version={{.VERSION}}
        -X github.com/dahal/bolted/internal/buildinfo.Commit={{.COMMIT}}"
        -o dist/bolt ./cmd/bolt
      - ln -sf bolt dist/bolt
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "(devel)"
      COMMIT:
        sh: git rev-parse HEAD 2>/dev/null || echo unknown

  cli:install:
    desc: Install the bolt binary into $GOBIN and create a `bolt` symlink (unix)
    cmds:
      - >-
        go install
        -ldflags "-X github.com/dahal/bolted/internal/buildinfo.Version={{.VERSION}}
        -X github.com/dahal/bolted/internal/buildinfo.Commit={{.COMMIT}}"
        ./cmd/bolt
      - 'ln -sf bolt "$(go env GOBIN 2>/dev/null || echo $HOME/go/bin)/bolt"'
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "(devel)"
      COMMIT:
        sh: git rev-parse HEAD 2>/dev/null || echo unknown

  cli:test:
    desc: Run CLI unit tests
    cmds:
      - go test ./...

  cli:test:coverage:
    desc: Run CLI tests with a coverage report
    cmds:
      - go test -cover ./...

  cli:lint:
    desc: Lint the CLI (go vet)
    cmds:
      - go vet ./...

  cli:check:
    desc: Static-check the CLI (go vet)
    cmds:
      - go vet ./...

  docs:install:
    desc: Install docs dependencies
    dir: docs
    cmds:
      - pnpm install

  docs:dev:
    desc: Start docs dev server
    dir: docs
    cmds:
      - pnpm run dev

  docs:build:
    desc: Build the docs site
    dir: docs
    cmds:
      - pnpm run build

  docs:start:
    desc: Serve the built docs site
    dir: docs
    cmds:
      - pnpm run start

  docs:lint:
    desc: Lint the docs project
    dir: docs
    cmds:
      - pnpm run lint

  docs:check:
    desc: Type-check the docs project
    dir: docs
    cmds:
      - pnpm run types:check

  vm:build:
    desc: Build the Bolted VM image (Lima qcow2 + WSL2 rootfs tar) into vm-image/dist/
    dir: vm-image
    cmds:
      - ./mkimage.sh

  vm:publish:
    desc: Push the Bolted VM image to GitHub Container Registry
    dir: vm-image
    vars:
      IMAGE_REF: ghcr.io/dahal/bolted-vm:vm-1.0.0
    cmds:
      - docker tag bolted-vm:vm-1.0.0 {{.IMAGE_REF}}
      - docker push {{.IMAGE_REF}}

  cli:build:all:
    desc: Cross-compile the Bolted CLI for darwin/arm64, darwin/amd64, and windows/amd64 into ./dist/<os>-<arch>/
    cmds:
      - mkdir -p dist/darwin-arm64 dist/darwin-amd64 dist/windows-amd64
      - >-
        GOOS=darwin GOARCH=arm64 go build
        -ldflags "-X github.com/dahal/bolted/internal/buildinfo.Version={{.VERSION}}
        -X github.com/dahal/bolted/internal/buildinfo.Commit={{.COMMIT}}"
        -o dist/darwin-arm64/bolt ./cmd/bolt
      - >-
        GOOS=darwin GOARCH=amd64 go build
        -ldflags "-X github.com/dahal/bolted/internal/buildinfo.Version={{.VERSION}}
        -X github.com/dahal/bolted/internal/buildinfo.Commit={{.COMMIT}}"
        -o dist/darwin-amd64/bolt ./cmd/bolt
      - >-
        GOOS=windows GOARCH=amd64 go build
        -ldflags "-X github.com/dahal/bolted/internal/buildinfo.Version={{.VERSION}}
        -X github.com/dahal/bolted/internal/buildinfo.Commit={{.COMMIT}}"
        -o dist/windows-amd64/bolt.exe ./cmd/bolt
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "(devel)"
      COMMIT:
        sh: git rev-parse HEAD 2>/dev/null || echo unknown

  release:
    desc: Cross-compile all targets and compute SHA256SUMS in ./dist (does NOT upload)
    deps: [cli:build:all]
    cmds:
      - cd dist && find darwin-arm64 darwin-amd64 windows-amd64 -type f \( -name 'bolt' -o -name 'bolt.exe' \) | sort | xargs shasum -a 256 > SHA256SUMS
      - echo ""
      - echo "Built artifacts in ./dist/:"
      - ls -1 dist/darwin-arm64/bolt dist/darwin-amd64/bolt dist/windows-amd64/bolt.exe dist/SHA256SUMS
      - echo ""
      - echo "Next steps:"
      - echo "  1. Tag the release      task release:tag"
      - echo "  2. The release workflow will rebuild + publish a draft GitHub Release"
      - echo "  3. Review the draft at https://github.com/dahal/bolted/releases and publish when ready"

  release:tag:
    desc: After merging the release-please PR, push a signed tag for the version in .release-please-manifest.json
    cmds:
      - |
        VERSION=$(jq -r '."."' .release-please-manifest.json)
        if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
          echo "no version in .release-please-manifest.json" >&2
          exit 1
        fi
        TAG="v${VERSION}"
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "tag $TAG already exists locally — delete it first if you mean to re-cut" >&2
          exit 1
        fi
        git tag -s "$TAG" -m "$TAG"
        git push origin "$TAG"
        echo
        echo "pushed signed $TAG — release.yml will build artifacts shortly"
