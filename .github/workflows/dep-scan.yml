name: dep-scan

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'docs/package.json'
      - 'docs/pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'docs/package.json'
      - 'docs/pnpm-lock.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  osv:
    name: osv-scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.2.4

      - name: Scan dependencies
        continue-on-error: true
        run: |
          osv-scanner scan source \
            -L ./go.mod \
            -L ./docs/pnpm-lock.yaml \
            --format=json > osv-results.json

      - name: Comment on PR and fail if vulnerable
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('osv-results.json', 'utf8'));

            const vulns = [];
            for (const r of data.results ?? []) {
              const path = r.source?.path ?? '<unknown>';
              for (const p of r.packages ?? []) {
                for (const v of p.vulnerabilities ?? []) {
                  vulns.push({
                    id: v.id,
                    pkg: p.package.name,
                    version: p.package.version,
                    path,
                    summary: v.summary ?? 'no summary',
                  });
                }
              }
            }

            const marker = '<!-- dep-scan-comment -->';
            const { owner, repo } = context.repo;
            const sha = context.sha.slice(0, 7);

            const lines = vulns.length === 0
              ? [`OSV scan ✓ - no vulnerabilities in changed dependency files (\`${sha}\`).`]
              : [
                  `OSV scan ✗ - found **${vulns.length}** ${vulns.length === 1 ? 'vulnerability' : 'vulnerabilities'} in dependency files (\`${sha}\`).`,
                  '',
                  ...vulns.map(v => `- **${v.id}** in \`${v.pkg}@${v.version}\` (\`${v.path}\`) - ${v.summary}`),
                ];
            const body = `${marker}\n\n${lines.join('\n')}`;

            if (context.eventName === 'pull_request') {
              const issue_number = context.issue.number;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const existing = comments.find(c => c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body,
                });
                core.info(`Updated comment ${existing.id}.`);
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number, body,
                });
                core.info(`Created comment on PR #${issue_number}.`);
              }
            }

            if (vulns.length > 0) {
              core.setFailed(`${vulns.length} vulnerabilit${vulns.length === 1 ? 'y' : 'ies'} found.`);
            }
