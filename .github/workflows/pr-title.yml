name: pr-title

# Enforces Conventional Commits at the PR-title layer so the upstream
# gate matches what lefthook checks locally. release-please reads the
# squash-merge subject (= PR title) to decide version bumps, so getting
# this right keeps the changelog clean.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            build
            ci
            revert
