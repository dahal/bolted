# mobile — JVM + fastlane starter for mobile release workflows.
#
# Pulls in gh and a JDK; fastlane is installed from apk so it lands on
# $PATH without a separate gem-management dance.
features:
  - ghcr.io/devcontainers/features/github-cli:1
  - ghcr.io/devcontainers/features/java:1
packages:
  - fastlane
